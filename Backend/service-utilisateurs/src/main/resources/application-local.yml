server:
  port: ${SERVER_PORT:8088}
spring:
  datasource:
    url: jdbc:h2:mem:user_service_local;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: true
  flyway:
    enabled: false
